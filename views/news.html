<main class="page">

  <!-- News header -->
  <div class="news-head">
    <div class="news-head__title">
      <h1>News</h1>
      <p>Headlines behind the signals · Sun 15 Nov 2026</p>
    </div>

    <div class="news-filters" role="tablist" aria-label="Filter stories">
      <button class="news-filter is-active" role="tab" aria-selected="true" data-filter="all">All</button>
      <button class="news-filter" role="tab" aria-selected="false" data-filter="finance">Finance</button>
      <button class="news-filter" role="tab" aria-selected="false" data-filter="tech">Tech</button>
      <button class="news-filter" role="tab" aria-selected="false" data-filter="markets">Markets</button>
    </div>
  </div>

  <div class="news-grid">

    <!-- FINANCE COLUMN -->
    <section class="news-col" aria-labelledby="news-finance">
      <div class="news-col__head">
        <svg class="news-col__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <h2 id="news-finance">Finance</h2>
        <span class="news-col__count" id="count-finance">5 stories</span>
      </div>

      <ul class="news-list" id="news-list-finance"></ul>
    </section>

    <!-- TECH COLUMN -->
    <section class="news-col" aria-labelledby="news-tech">
      <div class="news-col__head">
        <svg class="news-col__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
        <h2 id="news-tech">Tech</h2>
        <span class="news-col__count" id="count-tech">5 stories</span>
      </div>

      <ul class="news-list" id="news-list-tech"></ul>
    </section>

  </div>
</main>
