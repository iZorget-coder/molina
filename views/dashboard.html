<div class="layout">

  <!-- Watchlist sidebar -->
  <aside class="sidebar">
    <div class="sidebar__head">
      <h2>Watchlist</h2>
      <span class="muted">0 markets</span>
    </div>

    <ul class="watch"></ul>

    <div class="chat-usage">
  <div class="chat-usage__row">
    <strong>AI chat</strong>
    <span class="muted" id="dashboard-ai-usage-count">Loading...</span>
  </div>
  <div class="progress">
    <div class="progress__bar" id="dashboard-ai-usage-bar" style="width:0%"></div>
  </div>
</div>
  </aside>

  <!-- Forecasts -->
  <main class="main">
    <div class="main__head">
      <div>
        <h1 id="forecast-title">Forecasts</h1>
        <p class="muted" id="forecast-sub">Loading the latest forecasts…</p>
      </div>
      
    </div>

    <section class="cards" id="dashboard-cards"></section>
  </main>

  <!-- News -->
  <aside class="news">
    <div class="news__head">
      <h2>News</h2>
      <a href="#news" class="link">View all</a>
    </div>

    <ul class="news__list" id="dashboard-news-list"></ul>
  </aside>

</div>
