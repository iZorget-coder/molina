<div class="layout">

  <!-- Watchlist sidebar -->
  <aside class="sidebar">
    <div class="sidebar__head">
      <h2>Watchlist</h2>
      <span class="muted">0 markets</span>
    </div>

    <ul class="watch"></ul>

    <div class="chat-usage">
      <div class="chat-usage__row">
        <strong>AI chat</strong>
        <span class="muted">7 of 10 used today</span>
      </div>
      <div class="progress"><div class="progress__bar" style="width:70%"></div></div>
    </div>
  </aside>

  <!-- Forecasts -->
  <main class="main">
    <div class="main__head">
      <div>
        <h1>Forecasts for Mon 16 Nov</h1>
        <p class="muted">Based on the Friday close, 13 Nov 2026</p>
      </div>
      <button class="btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
        Daily model
      </button>
    </div>

    <section class="cards" id="dashboard-cards"></section>
  </main>

  <!-- News -->
  <aside class="news">
    <div class="news__head">
      <h2>News</h2>
      <a href="#news" class="link">View all</a>
    </div>

    <ul class="news__list" id="dashboard-news-list"></ul>
  </aside>

</div>
