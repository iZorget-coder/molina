<main class="page">
  <div class="page__head">
    <div>
      <h1>Watchlist</h1>
      <p class="muted" id="watchlist-count">1 market</p>
    </div>
    <button class="btn btn--primary" data-open="add-market-modal">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add market
    </button>
  </div>

  <div class="chips">
    <button class="chip is-active" data-filter="all">All</button>
    <button class="chip" data-filter="up">Up</button>
    <button class="chip" data-filter="down">Down</button>
    <button class="chip" data-filter="flat">Flat</button>
  </div>

  <table class="table" id="watchlist-table">
    <thead>
      <tr>
        <th class="col-market">Market</th>
        <th class="col-close num">Last close</th>
        <th class="col-pred">Forecast</th>
        <th class="col-change num">Change</th>
        <th class="col-actions"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<dialog class="add-modal" id="add-market-modal" aria-labelledby="add-modal-title">

  <header class="add-modal__head">
    <div>
      <h2 id="add-modal-title">Add market</h2>
      <p>Choose the markets you want on your watchlist.</p>
    </div>
    <button type="button" class="add-modal__close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </header>

  <p class="add-modal__empty" hidden>All five markets are already on your watchlist.</p>

  <ul class="add-modal__list">
    <li>
      <label class="add-modal__row" data-symbol="SPX">
        <input type="checkbox" name="market" value="SPX">
        <span class="add-modal__box" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span class="add-modal__name"><strong>S&amp;P 500</strong><span>SPX · Index</span></span>
        <span class="add-modal__price">5,892.40</span>
        <span class="add-modal__tag add-modal__tag--up">▲ UP 62%</span>
        <span class="add-modal__pill">In watchlist</span>
      </label>
    </li>
    <li>
      <label class="add-modal__row" data-symbol="NDX">
        <input type="checkbox" name="market" value="NDX">
        <span class="add-modal__box" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span class="add-modal__name"><strong>NASDAQ</strong><span>NDX · Index</span></span>
        <span class="add-modal__price">20,431.18</span>
        <span class="add-modal__tag add-modal__tag--down">▼ DOWN 58%</span>
        <span class="add-modal__pill">In watchlist</span>
      </label>
    </li>
    <li>
      <label class="add-modal__row" data-symbol="DJI">
        <input type="checkbox" name="market" value="DJI">
        <span class="add-modal__box" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span class="add-modal__name"><strong>DOW JONES</strong><span>DJI · Index</span></span>
        <span class="add-modal__price">43,128.65</span>
        <span class="add-modal__tag add-modal__tag--flat">◆ CONSOLIDATION 51%</span>
        <span class="add-modal__pill">In watchlist</span>
      </label>
    </li>
    <li>
      <label class="add-modal__row" data-symbol="XAUUSD">
        <input type="checkbox" name="market" value="XAUUSD">
        <span class="add-modal__box" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span class="add-modal__name"><strong>Gold</strong><span>XAUUSD · Commodity</span></span>
        <span class="add-modal__price">2,447.85</span>
        <span class="add-modal__tag add-modal__tag--up">▲ UP 62%</span>
        <span class="add-modal__pill">In watchlist</span>
      </label>
    </li>
    <li>
      <label class="add-modal__row" data-symbol="DXY">
        <input type="checkbox" name="market" value="DXY">
        <span class="add-modal__box" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span class="add-modal__name"><strong>US Dollar Index</strong><span>DXY · FX</span></span>
        <span class="add-modal__price">104.27</span>
        <span class="add-modal__tag add-modal__tag--down">▼ DOWN 55%</span>
        <span class="add-modal__pill">In watchlist</span>
      </label>
    </li>
  </ul>

  <footer class="add-modal__foot">
    <p class="add-modal__count" aria-live="polite"><span data-count>0</span> selected</p>
    <div class="add-modal__actions">
      <button type="button" class="add-modal__btn" data-close>Cancel</button>
      <button type="button" class="add-modal__btn add-modal__btn--primary" data-add-selected disabled>Add selected</button>
    </div>
  </footer>

</dialog>
