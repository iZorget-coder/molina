<main class="page">
  <div class="ai-layout">

    <!-- LEFT: Chat history -->
    <aside class="ai-side" aria-label="Chat history">
      <button type="button" class="ai-new" id="ai-new-chat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>

      <h2 class="ai-side__label">Recent</h2>
      <ul class="ai-recent" id="ai-recent-list">
        <!-- Populated by JS -->
      </ul>

      <div class="ai-usage">
        <div class="ai-usage__row"><strong>Daily usage</strong><span id="ai-usage-count">0 / 5</span></div>
        <div class="ai-usage__bar" role="progressbar" aria-label="Messages used today" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span id="ai-usage-bar" style="width:0%"></span></div>
        <p id="ai-usage-text">5 messages left today</p>
      </div>
    </aside>

    <!-- CENTER: conversation -->
    <section class="ai-chat" aria-label="Conversation">
      <header class="ai-chat__head">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
        <h1 id="ai-chat-title">Molina AI</h1>
        <span class="ai-chat__ctx" id="ai-chat-ctx">Context: —</span>
      </header>

      <div class="ai-chat__scroll" role="log" aria-live="polite" id="ai-chat-scroll">
        <div class="ai-chat__inner" id="ai-messages">
          <!-- Messages injected here -->
        </div>
      </div>

      <footer class="ai-chat__foot">
        <div class="ai-chat__foot-inner">
          <div class="ai-model-selector">
            <label for="ai-model">Model:</label>
            <select id="ai-model" class="ai-model-select">
              <option value="openrouter/free">Auto (Free Router)</option>
            </select>
          </div>

          <div class="ai-composer">
            <input class="ai-composer__input" type="text" placeholder="Ask about your watchlist…" aria-label="Ask about your watchlist" id="ai-input">
            <span class="ai-composer__left" id="ai-input-hint">5 left today</span>
            <button type="button" class="ai-send" aria-label="Send message" id="ai-send">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>

          <p class="ai-disclaimer">Molina AI can make mistakes. Forecasts are probabilistic and not financial advice.</p>
        </div>
      </footer>
    </section>

    <!-- RIGHT: chat context -->
    <aside class="ai-ctx" aria-label="Chat context">
      <h2>Chat context</h2>
      <section class="ai-ctx__card" id="ai-ctx-card">
         <!-- Populated by JS based on market -->
      </section>
      <a href="#settings" class="ai-ctx__link">Change DXY preference in Settings</a>
    </aside>

  </div>
</main>
