name: Daily Market Pipeline

on:
  schedule:
    # Runs at 22:00 UTC = 00:00 SAST the next day
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use the version your scripts need

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # Create this file with your dependencies (pandas, scikit-learn, etc.)

      - name: Run Intraday Extraction Notebook
        run: |
          # Use papermill or nbconvert to execute the notebook
          pip install papermill
          papermill "Intraday extract.ipynb" "intraday_output.ipynb"

      - name: Run Market Data Notebook
        run: |
          papermill "market data.ipynb" "market_output.ipynb"

      - name: Push Predictions to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python push_to_firestore.py