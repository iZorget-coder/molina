name: Daily Market Pipeline

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never run two pipelines at once (e.g. a scheduled run plus a manual one)
concurrency:
  group: daily-market-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Extraction
        run: python "Intraday extract.py"

      - name: Update Daily CSVs (Yahoo + Hourly fallback)
        run: python update_daily_csvs.py

      - name: Run Market Data Pipeline
        run: python "market data.py"

      - name: Verify predictions.json
        run: cat predictions.json

      - name: Push to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python push_to_firestore.py
 
      - name: Commit updated CSVs and predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add *.csv predictions.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update market data $(date -u +%Y-%m-%d)"

          # The run takes several minutes, so someone may have pushed in the meantime.
          # Rebase our commit on top of whatever is on main now, then push; retry if main moved again.
          # In a rebase, "theirs" is the commit being replayed (this bot commit), so generated data wins any conflict.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "Could not push after 5 attempts"
          exit 1

      - name: Delete daily chats
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python delete_chats.py

          