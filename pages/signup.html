      </div>

      <div class="panel-copy">
        <h1>Start with the daily view,<br class="desktop-break"> then go deeper.</h1>
        <p>Create an account to follow forecasts for indices, gold and FX, with the reasoning shown.</p>
      </div>
    </section>

    <!-- Right sign-up panel -->
    <section class="form-panel" aria-label="Create your Molina account">
      <div class="login-card">
        <div class="card-heading">
          <h2>Create your account</h2>
          <p>Set up Molina to see today's forecasts.</p>
        </div>

      <div class="auth-error" id="auth-error" role="alert" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="8" x2="12" y2="13"/>
            <circle cx="12" cy="16.5" r="0.5" fill="currentColor"/>
          </svg>
          <span id="auth-error-text"></span>
      </div>

        <form class="login-form" id="signup-form" action="#" method="post">
          <div class="name-row">
            <div class="form-field">
              <label for="first-name">First name</label>
              <input id="first-name" name="firstName" type="text" placeholder="First name" autocomplete="given-name" required>
            </div>
            <div class="form-field">
              <label for="last-name">Surname</label>
              <input id="last-name" name="lastName" type="text" placeholder="Surname" autocomplete="family-name" required>
            </div>
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
          </div>

          <div class="form-field">
            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" minlength="8" required>
            <p class="field-error" id="confirm-error" role="alert" hidden>Passwords don't match.</p>
          </div>

          <label class="terms">
            <input type="checkbox" name="terms" required>
            <span>I agree to the <a href="#" class="text-link">Terms</a> and <a href="#" class="text-link">Privacy Policy</a>.</span>
          </label>

          <button class="login-button" type="submit">Create account</button>
        </form>

        <div class="divider"><span></span><p>or</p><span></span></div>

        <button class="google-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M3.5 12h17M12 3c2.4 2.4 3.5 5.4 3.5 9S14.4 18.6 12 21c-2.4-2.4-3.5-5.4-3.5-9S9.6 5.4 12 3Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          Sign up with Google
        </button>

        <p class="signup-prompt">Already have an account? <a href="login.html" class="text-link">Log in</a></p>
      </div>
    </section>
  </main>

  <script type="module">
  import {
    auth,
    createUserWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
  } from '../javascript/firebase.js';
  import {
    beginAuthFlow,
    endAuthFlow,
    isAuthFlowActive,
    ensureUserProfile
  } from '../javascript/profile.js';


  onAuthStateChanged(auth, (user) => {
    if (user && !isAuthFlowActive()) window.location.replace('app.html');
  });

  const form = document.getElementById('signup-form');
  const pw = document.getElementById('password');
  const confirm = document.getElementById('confirm');
  const confirmError = document.getElementById('confirm-error');
  const errorBox = document.getElementById('auth-error');
  const errorText = document.getElementById('auth-error-text');
  const submitBtn = form.querySelector('.login-button');
  const googleBtn = document.querySelector('.google-button');

  function showError(message) {
    errorText.textContent = message;
    errorBox.hidden = false;
  }
  function clearError() {
    errorBox.hidden = true;
    errorText.textContent = '';
  }
  function setBusy(busy) {
    submitBtn.disabled = busy;
    googleBtn.disabled = busy;
  }


  async function saveProfileThenEnter(user, names) {
    try {
      await ensureUserProfile(user, names);
    } catch (err) {
      console.error('Could not save profile', err);
    }
    window.location.replace('app.html');
  }

 
  function check() {
    const mismatch = confirm.value !== '' && confirm.value !== pw.value;
    confirm.setCustomValidity(mismatch ? "Passwords don't match." : '');
    confirm.classList.toggle('is-invalid', mismatch);
    confirmError.hidden = !mismatch;
  }
  pw.addEventListener('input', check);
  confirm.addEventListener('input', check);
  form.addEventListener('submit', check);
  form.addEventListener('input', clearError);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    if (confirm.value !== pw.value) return;

    const firstName = document.getElementById('first-name').value.trim();
    const lastName = document.getElementById('last-name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    setBusy(true);
    beginAuthFlow();
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await saveProfileThenEnter(cred.user, { firstName, lastName });
    } catch (error) {
      endAuthFlow();
      setBusy(false);
      switch (error.code) {
        case 'auth/email-already-in-use':
          showError('An account with this email already exists. Try logging in instead.');
          break;
        case 'auth/weak-password':
          showError('Password should be at least 6 characters.');
          break;
        case 'auth/invalid-email':
          showError('That email address is not valid.');
          break;
        case 'auth/operation-not-allowed':
          showError('Email/password sign-up is not enabled for this project.');
          break;
        default:
          showError(error.message || 'Sign-up failed. Please try again.');
      }
    }
  });

  googleBtn.addEventListener('click', async () => {
    clearError();
    setBusy(true);
    beginAuthFlow();
    try {
     
      const cred = await signInWithPopup(auth, new GoogleAuthProvider());
      await saveProfileThenEnter(cred.user, {});
    } catch (error) {
      endAuthFlow();
      setBusy(false);
      if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
        showError(error.message || 'Google sign-in failed.');
      }
    }
  });
</script>
</body>
</html>
