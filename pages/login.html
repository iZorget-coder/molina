        </svg>
      </div>

      <div class="panel-copy">
        <h1>Direction, probability and context<br class="desktop-break"> in one view.</h1>
        <p>Daily forecasts for indices, gold and FX, with the reasoning shown.</p>
      </div>
    </section>

    <!-- Right login panel -->
    <section class="form-panel" aria-label="Log in to Molina">
      <div class="login-card">
       <div class="card-heading">
          <h2>Welcome back</h2>
          <p>Log in to see today's forecasts.</p>
        </div>

        <div class="auth-error" id="auth-error" role="alert" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="8" x2="12" y2="13"/>
            <circle cx="12" cy="16.5" r="0.5" fill="currentColor"/>
          </svg>
          <span id="auth-error-text"></span>
        </div>

        <form class="login-form" action="#" method="post">
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="form-field">
            <div class="password-label-row">
              <label for="password">Password</label>
              <a href="#" class="text-link">Forgot password?</a>
            </div>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          </div>

          <button class="login-button" type="submit">Log in</button>
        </form>

        <div class="divider"><span></span><p>or</p><span></span></div>

        <button class="google-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M3.5 12h17M12 3c2.4 2.4 3.5 5.4 3.5 9S14.4 18.6 12 21c-2.4-2.4-3.5-5.4-3.5-9S9.6 5.4 12 3Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          Continue with Google
        </button>

        <p class="signup-prompt">New here? <a href="signup.html" class="text-link">Sign up</a></p>
      </div>
    </section>
  </main>

  <script type="module">
  import {
    auth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
  } from '../javascript/firebase.js';
  import {
    beginAuthFlow,
    endAuthFlow,
    isAuthFlowActive,
    ensureUserProfile
  } from '../javascript/profile.js';

  const APP_URL = import.meta.env.BASE_URL + 'pages/app.html';

  // Redirect if already signed in (but not while a Google sign-in is still saving the profile)
  onAuthStateChanged(auth, (user) => {
    if (user && !isAuthFlowActive()) window.location.replace(APP_URL);
  });

  const form = document.querySelector('.login-form');
  const errorBox = document.getElementById('auth-error');
  const errorText = document.getElementById('auth-error-text');

  function showError(message) {
    errorText.textContent = message;
    errorBox.hidden = false;
  }

  function clearError() {
    errorBox.hidden = true;
    errorText.textContent = '';
  }

  // Clear the error as soon as the user starts typing again
  form.addEventListener('input', clearError);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.replace(APP_URL);
    } catch (error) {
      switch (error.code) {
        case 'auth/invalid-credential':
        case 'auth/wrong-password':
        case 'auth/user-not-found':
          showError('Email or password is incorrect. If you signed up with Google, use “Continue with Google” below.');
          break;
        case 'auth/invalid-email':
          showError('That email address is not valid.');
          break;
        case 'auth/too-many-requests':
          showError('Too many attempts. Please wait a few minutes and try again.');
          break;
        case 'auth/network-request-failed':
          showError('Network error. Check your connection and try again.');
          break;
        default:
          showError(error.message || 'Sign-in failed. Please try again.');
      }
    }
  });

  const googleBtn = document.querySelector('.google-button');
  googleBtn.addEventListener('click', async () => {
    clearError();
    googleBtn.disabled = true;
    beginAuthFlow();
    try {
      const cred = await signInWithPopup(auth, new GoogleAuthProvider());
      // First Google sign-in creates the profile (name + avatar); later ones just fill gaps.
      try {
        await ensureUserProfile(cred.user);
      } catch (err) {
        console.error('Could not save profile', err);
      }
      window.location.replace(APP_URL);
    } catch (error) {
      endAuthFlow();
      googleBtn.disabled = false;
      if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
        showError(error.message || 'Google sign-in failed.');
      }
    }
  });
</script>
</body>
</html>
